services:
  posts-db-1:
    image: mysql:8.4
    container_name: posts-db-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123!
      MYSQL_DATABASE: ImageSharingPostsDb
    ports:
      - "33061:3306"
    volumes:
      - posts-db-1-data:/var/lib/mysql
    command:
      - mysqld
      - --server_id=1
      - --binlog_checksum=NONE
      - --gtid_mode=ON
      - --enforce_gtid_consistency=ON
      - --log_bin
      - --log_replica_updates=ON
      - --skip-name-resolve
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - posts-cluster

  posts-db-2:
    image: mysql:8.4
    container_name: posts-db-2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123!
    ports:
      - "33062:3306"
    volumes:
      - posts-db-2-data:/var/lib/mysql
    command:
      - mysqld
      - --server_id=2
      - --binlog_checksum=NONE
      - --gtid_mode=ON
      - --enforce_gtid_consistency=ON
      - --log_bin
      - --log_replica_updates=ON
      - --skip-name-resolve
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - posts-cluster

  posts-db-3:
    image: mysql:8.4
    container_name: posts-db-3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123!
    ports:
      - "33063:3306"
    volumes:
      - posts-db-3-data:/var/lib/mysql
    command:
      - mysqld
      - --server_id=3
      - --binlog_checksum=NONE
      - --gtid_mode=ON
      - --enforce_gtid_consistency=ON
      - --log_bin
      - --log_replica_updates=ON
      - --skip-name-resolve
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - posts-cluster

  posts-db-router:
    image: container-registry.oracle.com/mysql/community-router:8.4
    container_name: posts-db-router
    restart: unless-stopped
    depends_on:
      posts-db-1:
        condition: service_healthy
      posts-db-2:
        condition: service_healthy
      posts-db-3:
        condition: service_healthy
    ports:
      - "6446:6446"
      - "6447:6447"
    volumes:
      - posts-db-router-data:/router
    entrypoint:
      - /bin/sh
      - /work/bootstrap-router.sh
    environment:
      ROUTER_BOOTSTRAP_HOST: posts-db-1
      ROUTER_BOOTSTRAP_PORT: 3306
      ROUTER_BOOTSTRAP_USER: root
      ROUTER_BOOTSTRAP_PASSWORD: root123!
    configs:
      - source: bootstrap-router-sh
        target: /work/bootstrap-router.sh
        mode: 0555
    networks:
      - posts-cluster

  posts-kafka:
    image: apache/kafka:4.1.2
    container_name: posts-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - posts-cluster

  posts-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: posts-kafka-ui
    restart: unless-stopped
    depends_on:
      - posts-kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: posts-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: posts-kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - posts-cluster

  posts-minio:
    image: minio/minio:latest
    container_name: posts-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - posts-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - posts-cluster

  posts-minio-init:
    image: minio/mc:latest
    container_name: posts-minio-init
    depends_on:
      posts-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://posts-minio:9000 minioadmin minioadmin; do sleep 2; done &&
        mc mb --ignore-existing local/posts &&
        mc anonymous set download local/posts
    networks:
      - posts-cluster

networks:
  posts-cluster:
    name: posts-cluster

volumes:
  posts-db-1-data:
  posts-db-2-data:
  posts-db-3-data:
  posts-db-router-data:
  posts-minio-data:

configs:
  bootstrap-router-sh:
    content: |
      #!/bin/sh
      set -eu
      ROUTER_DIR=/router
      if [ ! -f "$$ROUTER_DIR/mysqlrouter.conf" ]; then
        until echo "$$ROUTER_BOOTSTRAP_PASSWORD" | mysqlrouter \
          --bootstrap "$$ROUTER_BOOTSTRAP_USER@$$ROUTER_BOOTSTRAP_HOST:$$ROUTER_BOOTSTRAP_PORT" \
          --directory "$$ROUTER_DIR" \
          --user root \
          --force; do
          echo "Waiting for InnoDB Cluster metadata before bootstrapping Router..."
          sleep 5
        done
      fi
      exec "$$ROUTER_DIR/start.sh"
